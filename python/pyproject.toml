[build-system]
requires = ["maturin>=1.5"]
build-backend = "maturin"

[project]
name = "mathrobors"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "pytest"
]

[tool.maturin]
bindings = "pyo3"
module-name = "mathrobors"
cargo-manifest-path = "Cargo.toml"

[tool.uv.sources]
mathrobo = { path = "../vendor/MathRobo" }

[dependency-groups]
dev = [
    "maturin>=1.5",
    "pytest-benchmark>=5.2.3",
    "mathrobo",
    "cffi>=2.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "benchmarks"]
addopts = "-m 'not dev'"
markers = ["dev: development-only checks (not run by default)"]
